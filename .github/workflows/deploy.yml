name: Work website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate pages, links, accessibility references, and domain
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          for file in site/*.js; do node --check "$file"; done
      - name: Install media validator
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Decode the complete film and captions
        run: |
          ffmpeg -v error -xerror -i site/assets/work-desktop-film.mp4 -f null -
          ffmpeg -v error -xerror -i site/assets/work-desktop-film.vtt -f srt - > /dev/null

  deploy:
    name: Deploy to work.software
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
